# LiveKit OSS — LOCAL DEVELOPMENT ONLY.
#
# Derived from `docker run --rm livekit/generate --local`, which emits port 7880,
# tcp_port 7881 and a UDP mux starting at 7882 with use_external_ip disabled.
#
# Differences from that output, all deliberate:
#   - keys are NOT inlined here. They are generated on first `docker compose up`
#     into livekit.dev.keys.yaml, which is gitignored. See key_file below.
#   - no TURN. TURN exists to traverse hostile networks; localhost is not one.
#   - no Redis. A single node does not need one.
#
# Staging/production configuration is NOT this file.

port: 7880
bind_addresses:
  - ''

# Written by the keygen service on first run, mode 0600.
key_file: /etc/livekit/livekit.dev.keys.yaml

logging:
  json: false
  level: info

rtc:
  tcp_port: 7881
  # Single UDP mux socket. Staging widens this to a range sized to the VM's vCPU
  # count; a laptop with one browser tab does not need the range.
  udp_port: 7882
  use_external_ip: false
