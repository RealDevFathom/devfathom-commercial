name: Image build

# The staging image build is the only thing that compiles this app for a
# container, and it only runs after a merge — so a build that dies on x86_64 is
# found in the deploy, not in the pull request. This runs the same build on a
# native x64 runner, before merge. It needs no secret: the Dockerfile supplies
# its own AUTH_SECRET=container-build-only, and nothing here pushes or deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the image on native amd64
    if: contains(github.event.pull_request.labels.*.name, 'ci-ready') || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The point of this job is the architecture. If `ubuntu-latest` ever moves
      # to arm64, a passing build would stop meaning what it says here.
      - name: Require a native x64 runner
        run: |
          if [ "$RUNNER_ARCH" != "X64" ]; then
            echo "::error::this check only proves anything on x64, but the runner reported $RUNNER_ARCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the image
        run: docker build --progress=plain .

  final-gate:
    name: Required validation gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Require completed validation for protected pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          if (process.env.EVENT_NAME === 'pull_request' && ['develop', 'main'].includes(process.env.BASE_REF)) {
            const jobs = JSON.parse(process.env.RESULTS);
            const failures = Object.entries(jobs).filter(([, job]) => job.result !== 'success');
            if (failures.length) {
              console.error('Required validation did not succeed: ' + failures.map(([name, job]) => `${name}=${job.result}`).join(', '));
              process.exit(1);
            }
          }
          NODE
