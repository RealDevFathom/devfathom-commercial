name: Image build

# The staging image build is the only thing that compiles this app for a
# container, and it only runs after a merge — so a build that dies on x86_64 is
# found in the deploy, not in the pull request. This runs the same build for
# linux/amd64 (emulated on the self-hosted Mac runner), before merge. It needs no secret: the Dockerfile supplies
# its own AUTH_SECRET=container-build-only, and nothing here pushes or deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the image on native amd64
    if: contains(github.event.pull_request.labels.*.name, 'ci-ready') || github.event_name != 'pull_request'
    # Self-hosted Linux runner in Docker on the Mac (arm64 host). The build is
    # forced to linux/amd64 through buildx emulation, so an x86_64-only build
    # failure still shows up here, without spending GitHub-hosted minutes.
    runs-on: [self-hosted, linux, mac-runner]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image for linux/amd64
        run: docker buildx build --platform linux/amd64 --progress=plain .
