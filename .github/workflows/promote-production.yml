name: Promote production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Staging-approved sha256 image digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}
      AZURE_MIGRATION_JOB_NAME: ${{ vars.AZURE_PRODUCTION_MIGRATION_JOB_NAME }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_PRODUCTION_CONTAINER_APP_NAME }}
    steps:
      - name: Validate image digest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid digest.' >&2; exit 1; }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote approved digest
        shell: bash
        run: |
          set -euo pipefail
          image="${AZURE_ACR_NAME}.azurecr.io/devfathom-commercial@${IMAGE_DIGEST}"
          az acr repository show --name "$AZURE_ACR_NAME" --image "devfathom-commercial@${IMAGE_DIGEST}" --output none

          migration_command=$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_MIGRATION_JOB_NAME" --query "properties.template.containers[?name=='migrate'].args[1] | [0]" --output tsv)
          [[ "$migration_command" == 'bun prisma/prepare-extensions.ts && bunx prisma migrate deploy' ]] || { echo 'Production migration job is not configured for the supported migration-only path.' >&2; exit 1; }
          initialization_secrets=$(az containerapp job secret list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_MIGRATION_JOB_NAME" --query "[?name=='seed-password' || name=='admin-password' || name=='platform-admin-password'].name" --output tsv)
          [[ -z "$initialization_secrets" ]] || { echo 'Production migration job still contains initialization secrets.' >&2; exit 1; }

          az containerapp job update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_MIGRATION_JOB_NAME" --image "$image" --output none
          execution=$(az containerapp job start --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_MIGRATION_JOB_NAME" --query name --output tsv)
          for attempt in {1..90}; do
            status=$(az containerapp job execution show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_MIGRATION_JOB_NAME" --job-execution-name "$execution" --query properties.status --output tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) echo "Migration execution failed: $status" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 90 ]; then echo 'Migration execution timed out.' >&2; exit 1; fi
            sleep 10
          done

          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --image "$image" --output none
          configured_image=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --query "properties.template.containers[?name=='web'].image | [0]" --output tsv)
          [[ "$configured_image" == "$image" ]] || { echo 'Container App template does not reference the requested digest.' >&2; exit 1; }
          latest_revision=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --query properties.latestRevisionName --output tsv)

          for attempt in {1..30}; do
            ready_revision=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --query properties.latestReadyRevisionName --output tsv)
            if [[ -n "$latest_revision" && "$ready_revision" == "$latest_revision" ]]; then
              revision_image=$(az containerapp revision show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --revision "$ready_revision" --query "properties.template.containers[?name=='web'].image | [0]" --output tsv)
              revision_active=$(az containerapp revision show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --revision "$ready_revision" --query properties.active --output tsv)
              if [[ "$revision_image" == "$image" && "$revision_active" == 'true' ]]; then break; fi
            fi
            if [ "$attempt" -eq 30 ]; then echo 'Requested Container App revision did not become ready.' >&2; exit 1; fi
            sleep 10
          done

          fqdn=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP_NAME" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --show-error --silent --connect-timeout 5 --max-time 10 --retry 12 --retry-delay 10 --retry-max-time 150 --retry-all-errors "https://$fqdn/api/health"
