name: Promote production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Staging-approved sha256 image digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote approved digest
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.image_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid digest.' >&2; exit 1; }
          image="${{ vars.AZURE_ACR_NAME }}.azurecr.io/devfathom-commercial@${{ inputs.image_digest }}"
          az acr repository show --name "${{ vars.AZURE_ACR_NAME }}" --image "devfathom-commercial@${{ inputs.image_digest }}" --output none
          az containerapp job update --resource-group "${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}" --name "${{ vars.AZURE_PRODUCTION_MIGRATION_JOB_NAME }}" --image "$image" --output none
          execution=$(az containerapp job start --resource-group "${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}" --name "${{ vars.AZURE_PRODUCTION_MIGRATION_JOB_NAME }}" --query name --output tsv)
          for attempt in {1..90}; do
            status=$(az containerapp job execution show --resource-group "${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}" --name "${{ vars.AZURE_PRODUCTION_MIGRATION_JOB_NAME }}" --job-execution-name "$execution" --query properties.status --output tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) echo "Migration execution failed: $status" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 90 ]; then echo 'Migration execution timed out.' >&2; exit 1; fi
            sleep 10
          done
          az containerapp update --resource-group "${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}" --name "${{ vars.AZURE_PRODUCTION_CONTAINER_APP_NAME }}" --image "$image" --output none
