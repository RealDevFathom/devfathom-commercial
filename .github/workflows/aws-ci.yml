name: AWS CI

# Pull-request gates for the AWS path, also reused by the staging deploy
# workflow. This does not talk to AWS. Synth uses the placeholder account.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: aws-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test, and synth
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devfathom_ci
      AUTH_SECRET: ci-only-secret-value-not-used-anywhere-else
      AUTH_URL: http://localhost:4319
      NEXT_PUBLIC_APP_URL: http://localhost:4319
      AUTH_TRUST_HOST: 'true'
      PLATFORM_ENCRYPTION_KEY: ci-only-platform-encryption-key
      PLATFORM_BASE_DOMAIN: localhost
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Generate route types
        run: bunx next typegen
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Check shell entrypoints
        run: |
          set -euo pipefail
          bash -n docker/aws-entrypoint.sh
          bash -n docker/evolution/entrypoint.sh
          bash -n infra/aws/scripts/rollout.sh
          bash -n infra/aws/scripts/deploy-compute.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - name: Synth staging and production
        working-directory: infra/aws
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          unset CDK_DEFAULT_ACCOUNT CDK_DEFAULT_REGION AWS_REGION AWS_DEFAULT_REGION \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE \
            DEVFATHOM_AWS_ACCOUNT || true
          npm ci
          npx cdk synth --strict -c stage=staging -c region=ap-south-1
          npx cdk synth --strict -c stage=production -c region=ap-south-1
