# Dependabot: hardened config
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# - Security updates are grouped per ecosystem and skip cooldown.
# - Version updates wait (cooldown) before adopting fresh releases to reduce supply-chain risk.
# - Major updates are never grouped (one PR each).
# - Note: pin GitHub Actions to full commit SHAs in workflows; Dependabot keeps SHA pins updated.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Karachi"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/", "/infra/aws"]
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/docker/livekit"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
      compose-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
