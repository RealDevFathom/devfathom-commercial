AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  DevFathom image build in a second region, pushing to the ECR repository in
  the application region. For accounts where CodeBuild has no build capacity
  in the application region. Same buildspec and source layout as shared.yaml.

Parameters:
  RepositoryUri:
    Type: String
    Description: The application-region ECR repository (shared.yaml output RepositoryUri).
  RepositoryArn:
    Type: String
    Description: ARN of that repository.

Resources:
  BuildSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub devfathom-build-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-source-archives
            Status: Enabled
            ExpirationInDays: 30

  BuildSourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BuildSourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BuildSourceBucket.Arn
              - !Sub '${BuildSourceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /devfathom/codebuild/image
      RetentionInDays: 7

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: image-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${BuildLogGroup.Arn}:*'
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${BuildSourceBucket.Arn}/*'
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Ref RepositoryArn

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: devfathom-image
      Description: Builds the DevFathom image and pushes it to the application-region repository.
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub '${BuildSourceBucket}/source/latest.zip'
        BuildSpec: infra/aws/buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Value: !Ref RepositoryUri
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          StreamName: build

Outputs:
  BuildSourceBucketName:
    Value: !Ref BuildSourceBucket
  ImageBuildProjectName:
    Value: !Ref ImageBuildProject
