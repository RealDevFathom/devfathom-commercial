# CodeBuild recipe for the DevFathom image (project `devfathom-image`, infra/aws/shared.yaml).
# Start a build with IMAGE_TAG set to the commit sha of the uploaded source archive.
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - set -euo pipefail
      - '[[ "${IMAGE_TAG:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "IMAGE_TAG must be the 40-character source commit sha"; exit 1; }'
      - REGISTRY="${ECR_REPOSITORY_URI%%/*}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - (cd infra/aws && sha256sum -c rds-global-bundle.pem.sha256)
  build:
    on-failure: ABORT
    commands:
      # The repository's own Dockerfile, unchanged: the same image the existing
      # deployments build, including its `tsc --noEmit` gate.
      - docker build --progress=plain -t "devfathom-base:${IMAGE_TAG}" .
      - docker build --progress=plain --build-arg "BASE_IMAGE=devfathom-base:${IMAGE_TAG}" -t "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" -f infra/aws/Dockerfile.rds-ca infra/aws
  post_build:
    on-failure: ABORT
    commands:
      - docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
      - aws ecr describe-images --repository-name "${ECR_REPOSITORY_URI##*/}" --image-ids "imageTag=${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text
