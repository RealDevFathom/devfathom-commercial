[project]
name = "devfathom-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "pydantic-settings==2.10.1",
  "email-validator==2.2.0",
  "PyJWT==2.10.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "cryptography==45.0.7",
  "vercel==0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
